05,"PrzystanekId":906,"Iata":321},432853,1177575,{"Panstwo":385,"Przystanek":309,"Region":309,"Iata":310,"Godzina":908,"Przesuniecie":20},"09:40",{"Panstwo":313,"Przystanek":320,"Region":20,"Iata":321,"Godzina":910,"Przesuniecie":20},"15:35","11:55",10998,"LO6546",{"Data":915,"Cena":916,"Bilety":917,"Wybrana":9},"2026-11-21",3349,[918],{"BindId":394,"Id":919,"PakietId":920,"DaneDoSzczegolow":921,"Wylot":924,"Przylot":925,"CzasLotu":911,"CzyDreamliner":9,"Dokument":388,"NazwaPrzewoznika":389,"BagazPodreczny":39,"BagazRejestrowany":390,"BagazSportowy":20,"Wyzywienie":10,"Cena":916,"CenaRazem":926,"Pakiety":20,"KodPrzewoznikaIata":395,"NumerLotu":913,"Wybrany":9},"285718_432854",285718,{"TrasaWCId":922,"PrzystanekId":923,"Iata":321},432854,1177577,{"Panstwo":385,"Przystanek":309,"Region":309,"Iata":310,"Godzina":908,"Przesuniecie":20},{"Panstwo":313,"Przystanek":320,"Region":20,"Iata":321,"Godzina":910,"Przesuniecie":20},11098,"\u003Cp>Uwaga: informujemy o konieczności potwierdzenia godzin przelotu powrotnego u rezydenta. Telefon kontaktowy do rezydenta jest dostępny na stanowisku odpraw na lotnisku lub pod nr telefonu call center: +48 801 310 801 i +48 42 680 38 51 (w godz. 8-22).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>OD 01.05.2025r. Każdy podróżujący do Tajlandii zobowiązany jest do wypełnienia karty wjazdowej do Tajlandii (TDAC) na 48 h przed wylotem. Karta jest darmowa i znajduje się pod poniższym linkiem: https:\u002F\u002Ftdac.in.th\u002Fpl\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Uwaga: Zgodnie z przepisami Tajskiego Urzędu Lotnictwa Cywilnego jest bardzo dużo restrykcji obejmujących przeloty czarterowe.\u003C\u002Fp>\u003Cp>Nie można skorzystać z przelotu powrotnego czarterem LOT-u na trasie z Bangkoku do Warszawy lub z Bangkoku do Katowic oraz z Phuket do Warszawy lub z Phuket do Katowic jeśli nie przyleciało się do Tajlandii czarterem LOT-u z tego samego miasta wylotowego i do tego samego portu docelowego w ramach tego samego sezonu (od listopada do maja).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Nie można wymieszać portu wylotowego przy wylocie Polski z portem docelowym przy locie powrotnym (np. nie można przylecieć na trasie z Warszawy do Phuket i wrócić z Phuket do Katowic).\u003C\u002Fp>\u003Cp>Nie można wymieszać portu docelowego przy wylocie Polski z portem wylotowym przy locie powrotnym (np. nie można przylecieć na trasie z Warszawy do Bangkoku i wrócić z Phuket do Warszawy).\u003C\u002Fp>\u003Cp>Nie można wymieszać linii rejsowej przy wylocie z Polski, z linią czarterową LOT-u przy locie powrotnym (np. nie można przylecieć na trasie z Warszawy do Phuket linią rejsową Emirates i wrócić z Phuket do Warszawy czarterem LOT-u).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Można wylecieć i wrócić czarterem LOT-u do tego samego miasta w Polsce, przy wyborze tego samego portu w Tajlandii (np. można przylecieć na trasie z Warszawy do Phuket i wrócić z Phuket do Warszawy).\u003C\u002Fp>\u003Cp>Można również przylecieć lotem czarterowym do Bangkoku lub Phuket (niezależnie od portu wylotowego) i wrócić lotem rejsowym do Polski (np. można przylecieć czarterem LOT z Katowic do Phuket i wrócić z Bangkoku do Warszawy liną rejsową Emirates).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Przelot\u003C\u002Fp>\u003Cp>Samolot PLL LOT typu Dreamliner lub inny szerokokadłubowy (rejs bezpośredni) z możliwością wyboru klasy podróży. W klasie LOT CHARTERS Economy catering obejmuje 2 posiłki (ciepłe danie i kanapka z szynką lub serem). W ramach bezpłatnego serwisu pasażerowie otrzymają również nielimitowaną wodę mineralną. Pozostałe napoje typu soft, alkohole oraz wszystkie inne pozycje z menu sky baru dostępnego na pokładzie samolotu pozostają płatne dodatkowo.\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>W klasie LOT CHARTERS Premium i LOT CHARTERS Business w cenę wliczone bogatsze menu w tym wybrane napoje alkoholowe (w ograniczonych ilościach) i bezalkoholowe oraz zwiększony limit bagażowy. We wszystkich klasach indywidualny system rozrywki pokładowej z osobnym monitorem przed każdym fotelem. W przypadku niemożliwości wykonania rejsu samolotem Dreamliner, PLL LOT zapewni inny samolot o podobnym standardzie (rejs non stop).\u003C\u002Fp>\u003Cbr \u002F>\u003Cbr \u002F>\u003Cbr \u002F>",[929,1092,1197,1279,1434,1505,1658,1786,1906,1987],{"AtrybutyCharakterystyka":930,"BazoweInformacje":933,"Cena":961,"Czy3x2":10,"CzyDynamic":9,"CzyLight":9,"CzyPrzedluzony":10,"CzyZmienionoKolejnoscZdjecia":9,"Film":20,"Fiszki":963,"HotelWCId":969,"Klucz":970,"NazwaHoteluNP":971,"Ocena":972,"Przystanki":975,"Tags":20,"TerminWyjazdu":977,"UnikalnyKluczOferty":980,"WidocznePromocjeIds":981,"Wykluczone":982,"Wyzywienia":986,"Zdjecia":990,"ZdjeciaZOpisami":1016},[931,932],"bestseller","nowosc",{"Breadcrumbs":934,"DatyUrodzenia":945,"GwiazdkiHotelu":29,"HappyHoursKolejnosc":947,"HotelId":948,"ImprezaId":949,"KluczProduktHotel":950,"KodProduktu":951,"LiczbaDni":59,"LiczbaNocy":49,"LiczbaPokoi":6,"Lokalizacje":952,"NazwaHoteluWWW":8,"OfertaNazwa":953,"OfertaUrl":954,"OfertaUrlNoParams":955,"Panstwa":956,"ProduktId":957,"Regiony":958,"SezonUrl":959,"TypWycieczki":960,"TypWycieczkiZEtykiet":960},[935,938],[936],{"Nazwa":385,"Wartosc":937},"tajlandia",[939,941,944],{"Nazwa":309,"Wartosc":940},"phuket",{"Nazwa":942,"Wartosc":943},"Khao Lak","khao-lak",{"Nazwa":942,"Wartosc":943},[946,946],"1995-12-31",0,6621,248513,"6621_12556","TSC","Tajlandia: Phuket - Khao Lak","Phuket i nieznane oblicze Tajlandii light","\u002Fphuket-i-nieznane-oblicze-tajlandii-light\u002Fzakwaterowanie-tsc?unikalnyKluczOferty=At0ZAgwxA8HKAwECA99HnwEBAuk7AQIBBgEBAQEBAQADGkifAQECHWkBEQEDAQEBAQEBAAECAzrqEQECA3fuEQECAQIBBw%3D%3D&liczbaPokoi=1&czyCenaZaWszystkich=0&wiek=1995-12-31&wiek=1995-12-31","\u002Fphuket-i-nieznane-oblicze-tajlandii-light\u002Fzakwaterowanie-tsc",[385],12556,[309,942],"zima-26_27","objazd + wypoczynek",{"Cena":962,"CenaPrzedPromocja":962,"CzyCenaZaOsobe":10,"WolneMiejsca":947},6456,[964],{"KolorHex":965,"Nazwa":966,"Opis":967,"PokazBorder":10,"PokazNaWWW":10,"_key":9
