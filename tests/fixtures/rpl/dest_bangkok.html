em":931,"Pakiety":169,"KodPrzewoznikaIata":417,"NumerLotu":932,"Wybrany":158},"287975_433826",287975,{"TrasaWCId":939,"PrzystanekId":940,"Iata":321},433826,1179525,{"Panstwo":385,"Przystanek":309,"Region":309,"Iata":310,"Godzina":927,"Przesuniecie":169},{"Panstwo":313,"Przystanek":320,"Region":169,"Iata":321,"Godzina":929,"Przesuniecie":169},{"Route":944,"Tytul":8,"Podtytul":8,"NaglowekFAQ":945,"InformacjePodstawowe":946,"Opisy":169,"OpisyLokalizacji":955,"Artykuly":958,"Ocena":959,"Promocje":960},"\u002Fbilety-czarterowe\u002Ftajlandia\u002Fbangkok","Najczęściej zadawane pytania o wakacje w Bangkoku",{"Typ":947,"LokalizacjaId":948,"Nazwa":309,"NazwaUrl":949,"Dopelniacz":950,"Miejscownik":950,"Przyimek":951,"Zdjecie":952},"MIASTO",151,"bangkok","Bangkoku","w",{"Url":953,"Opis":8,"Alt":954},"https:\u002F\u002Fgrafiki.r.pl\u002Flokalizacja\u002F151\u002Ftajlandia-bangkok-bangkok-wakacje-123790.jpg?aspect_ratio=3%3A2","Panorama nocnego targu w Bangkoku.",[956],{"Opis":957},"\u003CP >Interesują Cię \u003CSTRONG>tanie loty do Bangkoku\u003C\u002FSTRONG>? Sprawdź naszą bogatą ofertę połączeń! Komfortowy, bezpośredni lot szerokokadłubowym samolotem typu Dreamliner będzie najlepszą opcją do rozpoczęcia Twoich azjatyckich wakacji!\u003C\u002FP>\r\n\u003CP >Bangkok to stolica Tajlandii w której mieszka...ponad 8 milionów ludzi! Znajduje się tu ponad 400 świątyń buddyjskich i hinduistycznych w tym najstarsza - \u003CSTRONG>Wat Pho (Świątynia Leżącego Buddy)\u003C\u002FSTRONG>. Wizytówką miasta jest oczywiście Wielki Pałac, zbudowany w XVIII wieku, którego styl architektoniczny idealnie oddaje religijną kulturowość tego kraju. Nocny krajobraz tego miasta wygląda iście imponująco. To miasto które nigdy nie zasypia. Pełne egzotycznych dźwięków, barw i smaków co roku gości ponad 20 milionów turystów z całego świata! Jeśli jesteś nastawiony na nocne szaleństwa musisz wybrać się na gwarną ulicę \u003CSTRONG>Khao San Road\u003C\u002FSTRONG>! To ikoniczne miejsce na mapie Bangkoku jest obowiązkowym punktem wielu turystów. Znajdziesz tu bary z muzyką na żywo, aromatyczny i tani street food, kluby taneczne oraz wiele innych ciekawych miejsc!\u003C\u002FP>\r\n\u003CP >Wiedzieliście, że pełna nazwa Bangkoku jest \u003CSTRONG>najdłuższą, geograficzną nazwą wpisaną\u003C\u002FSTRONG> do Księgi Guinessa i brzmi, w wolnym tłumaczeniu, następująco: \"Miasto aniołów, wielkie miasto, wieczny klejnot, niezdobywalne miasto boga Indry, wspaniała stolica świata wspomaganego przez dziewięć pięknych skarbów, miasto szczęśliwe, obfitujące w ogromny Pałac Królewski, który przypomina niebiańskie miejsce, gdzie rządzi reinkarnowany bóg, to miasto dane przez Indrę, zbudowane przez Wisznu\"?\u003C\u002FP>\r\n\u003CP >\u003CSTRONG>Tanie loty czarterowe do Bangkoku\u003C\u002FSTRONG> to idealna okazja aby bliżej poznać jedno z najbardziej egzotycznych miast na świecie a główne lotniska w Bangkoku - Suvarnabhumi (BKK) i Don Mueng (DMK) – są „furtką” do dalszej eksploracji azjatyckiego kontynentu.&nbsp;\u003C\u002FP>",[],0,[],"\u003Cp>Uwaga: informujemy o konieczności potwierdzenia godzin przelotu powrotnego u rezydenta. Telefon kontaktowy do rezydenta jest dostępny na stanowisku odpraw na lotnisku lub pod nr telefonu call center: +48 801 310 801 i +48 42 680 38 51 (w godz. 8-22).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Uwaga: Zgodnie z przepisami Tajskiego Urzędu Lotnictwa Cywilnego jest bardzo dużo restrykcji obejmujących przeloty czarterowe.\u003C\u002Fp>\u003Cp>Nie można skorzystać z przelotu powrotnego czarterem LOT-u na trasie z Bangkoku do Warszawy lub z Bangkoku do Katowic oraz z Phuket do Warszawy lub z Phuket do Katowic jeśli nie przyleciało się do Tajlandii czarterem LOT-u z tego samego miasta wylotowego i do tego samego portu docelowego w ramach tego samego sezonu (od listopada do maja).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Nie można wymieszać portu wylotowego przy wylocie Polski z portem docelowym przy locie powrotnym (np. nie można przylecieć na trasie z Warszawy do Bangkoku i wrócić z Bangkoku do Katowic).\u003C\u002Fp>\u003Cp>Nie można wymieszać portu docelowego przy wylocie Polski z portem wylotowym przy locie powrotnym (np. nie można przylecieć na trasie z Warszawy do Bangkoku i wrócić z Phuket do Warszawy).\u003C\u002Fp>\u003Cp>Nie można wymieszać linii rejsowej przy wylocie z Polski, z linią czarterową LOT-u przy locie powrotnym (np. nie można przylecieć na trasie z Warszawy do Bangkoku linią rejsową Emirates i wrócić z Bangkoku do Warszawy czarterem LOT-u).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Można wylecieć i wrócić czarterem LOT-u do tego samego miasta w Polsce, przy wyborze tego samego portu w Tajlandii (np. można przylecieć na trasie z Warszawy do Bangkoku i wrócić z Bangkoku do Warszawy).\u003C\u002Fp>\u003Cp>Można również przylecieć lotem czarterowym do Bangkoku lub Phuket (niezależnie od portu wylotowego) i wrócić lotem rejsowym do Polski (np. można przylecieć czarterem LOT z Katowic do Phuket i wrócić z Bangkoku do Warszawy liną rejsową Emirates).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Przelot\u003C\u002Fp>\u003Cp>Samolot PLL LOT typu Dreamliner lub inny szerokokadłubowy (rejs bezpośredni) z możliwością wyboru klasy podróży. W klasie LOT CHARTERS Economy catering obejmuje 2 posiłki (ciepłe danie i kanapka z szynką lub serem). W ramach bezpłatnego serwisu pasażerowie otrzymają również nielimitowaną wodę mineralną. Pozostałe napoje typu soft, alkohole oraz wszystkie inne pozycje z menu sky baru dostępnego na pokładzie samolotu pozostają płatne dodatkowo.\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>W klasie LOT CHARTERS Premium i LOT CHARTERS Business w cenę wliczone bogatsze menu w tym wybrane napoje alkoholowe (w ograniczonych ilościach) i bezalkoholowe oraz zwiększony limit bagażowy. We wszystkich klasach indywidualny system rozrywki pokładowej z osobnym monitorem przed każdym fotelem. W przypadku niemożliwości wykonania rejsu samolotem Dreamliner, PLL LOT zapewni inny samolot o podobnym standardzie (rejs non stop).\u003C\u002Fp>\u003Cbr \u002F>\u003Cp>Samolot World 2 Fly typu Airbus lub inny szerokokadłubowy z możliwością wyboru klasy podróży. W klasie Economy catering obejmuje 2 posiłki (ciepłe danie i kanapka z szynką lub serem). W ramach bezpłatnego serwisu pasażerowie otrzymają również nielimitowaną wodę mineralną. Pozostałe napoje typu soft, alkohole oraz wszystkie inne pozycje z menu sky baru dostępnego na pokładzie samolotu pozostają płatne dodatkowo. W klasie Business w cenę wliczone bogatsze menu w tym wybrane napoje alkoholowe (w ograniczonych ilościach) i bezalkoholowe oraz zwiększony limit bagażowy. We wszystkich klasach indywidualny system rozrywki pokładowej. W przypadku niemożliwości wykonania rejsu samolotem Airbus, World 2 Fly zapewni inny samolot o podobnym standardzie.\u003C\u002Fp>\u003Cbr \u002F>\u003Cbr \u002F>",[963,1087,1170,1321,1434,1583,1744,1810,1962,2117],{"AtrybutyCharakterystyka":964,"BazoweInformacje":965,"Cena":987,"Czy3x2":159,"CzyDynamic":158,"CzyLight":158,"CzyPrzedluzony":159,"CzyZmienionoKolejnoscZdjecia":158,"Film":169,"Fiszki":989,"HotelWCId":990,"Klucz":991,"NazwaHoteluNP":992,"Ocena":993,"Przystanki":996,"Tags":169,"TerminWyjazdu":998,"UnikalnyKluczOferty":1001,"WidocznePromocjeIds":1002,"Wykluczone":1003,"Wyzywienia":1007,"Zdjecia":1011,"ZdjeciaZOpisami":1031},[],{"Breadcrumbs":966,"DatyUrodzenia":972,"GwiazdkiHotelu":183,"HappyHoursKolejnosc":959,"HotelId":974,"ImprezaId":975,"KluczProduktHotel":976,"KodProduktu":977,"LiczbaDni":208,"LiczbaNocy":198,"LiczbaPokoi":156,"Lokalizacje":978,"NazwaHoteluWWW":169,"OfertaNazwa":979,"OfertaUrl":980,"OfertaUrlNoParams":981,"Panstwa":982,"ProduktId":983,"Regiony":984,"SezonUrl":985,"TypWycieczki":986,"TypWycieczkiZEtykiet":986},[967,970],[968],{"Nazwa":385,"Wartosc":969},"tajlandia",[971],{"Nazwa":309,"Wartosc":949},[973,973],"1995-12-31",2423,257144,"2423_12589","TBK","Tajlandia: Bangkok","Egzotyka Light - Tajlandia","\u002Fegzotyka-light-tajlandia\u002Fzakwaterowanie-tbk?unikalnyKluczOferty=A
