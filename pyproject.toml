[project]
name = "flightsearch"
version = "0.1.0"
description = "One-way Thailand→Poland flight search with Telegram alerts"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "httpx",
    "pyyaml",
    "flights",
    "beautifulsoup4",
    "selectolax",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flightsearch"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real external services (deselected by default)",
]
addopts = "-m 'not live'"

[tool.uv.sources]
flights = { git = "https://github.com/punitarani/fli.git" }
